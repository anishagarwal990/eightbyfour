<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAAHA India | Launching Soon</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Marcellus&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #0e0b0a;
    font-family: 'Cormorant Garamond', serif;
    overflow: hidden;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #1a1512 0%, #0a0807 70%, #050404 100%);
  }

  .stage::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(180,120,60,0.10), transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(140,90,40,0.10), transparent 45%);
    pointer-events: none;
  }

  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 40px;
    animation: fadeUp 1.6s ease-out;
  }

  .logo {
    width: min(60vw, 420px);
    height: auto;
    filter: drop-shadow(0 0 40px rgba(180,130,70,0.25));
    margin-bottom: 8px;
  }

  .divider {
    width: 1px;
    height: 46px;
    background: linear-gradient(to bottom, transparent, rgba(196,155,102,0.7), transparent);
    margin: 28px 0;
  }

  .launch {
    font-family: 'Marcellus', serif;
    font-size: clamp(1.4rem, 3.2vw, 2.2rem);
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: #e9d9bd;
    text-indent: 0.5em;
    margin-bottom: 18px;
  }

  .tagline {
    font-size: clamp(0.95rem, 1.6vw, 1.15rem);
    letter-spacing: 0.12em;
    color: rgba(230, 216, 195, 0.55);
    font-style: italic;
    font-weight: 300;
  }

  .glow-a, .glow-b {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    z-index: 1;
    opacity: 0.35;
  }
  .glow-a {
    width: 420px; height: 420px;
    background: radial-gradient(circle, rgba(190,140,80,0.35), transparent 70%);
    top: 10%;
    left: 8%;
  }
  .glow-b {
    width: 380px; height: 380px;
    background: radial-gradient(circle, rgba(160,110,60,0.3), transparent 70%);
    bottom: 8%;
    right: 10%;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .launch { letter-spacing: 0.32em; }
  }
</style>
</head>
